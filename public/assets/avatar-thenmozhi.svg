<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f7f3" />
      <stop offset="100%" stop-color="#e2efe7" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#165b3b" />
      <stop offset="100%" stop-color="#0d3824" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="397" height="397" rx="22.5" fill="none" stroke="#cbd5e1" stroke-width="3" />

  <!-- Background Decorative Rings -->
  <circle cx="200" cy="180" r="140" fill="none" stroke="#d1fae5" stroke-width="2" opacity="0.6" />
  <circle cx="200" cy="180" r="110" fill="#ffffff" opacity="0.75" />

  <!-- Avatar Silhouette - Female Professional Nutrition Coach -->
  <!-- Hair Base Silhouette (Soft bun / gentle professional style) -->
  <path d="M140 160 C130 110, 150 70, 200 70 C250 70, 270 110, 260 160 C265 190, 255 205, 245 210 C240 170, 235 120, 200 120 C165 120, 160 170, 155 210 C145 205, 135 190, 140 160 Z" fill="#134e32" />
  <circle cx="200" cy="72" r="28" fill="#134e32" />

  <!-- Head / Face Silhouette -->
  <ellipse cx="200" cy="155" rx="42" ry="50" fill="#e8f3ed" stroke="#134e32" stroke-width="3.5" />

  <!-- Professional Hair Framing -->
  <path d="M158 140 Q200 100 242 140 Q200 125 158 140 Z" fill="#134e32" />

  <!-- Neck & Collar -->
  <path d="M185 195 L215 195 L218 225 L182 225 Z" fill="#e8f3ed" stroke="#134e32" stroke-width="3" />

  <!-- Shoulders & Professional Attire -->
  <path d="M110 320 C110 260, 145 225, 180 220 L200 245 L220 220 C255 225, 290 260, 290 320 Z" fill="url(#primaryGrad)" />

  <!-- V-Neck Accent Collar -->
  <path d="M180 220 L200 255 L220 220" fill="none" stroke="#ccfbf1" stroke-width="4" stroke-linecap="round" />

  <!-- Wellness Leaf Emblem Badge on Lapel -->
  <g transform="translate(235, 255) scale(0.7)">
    <circle cx="20" cy="20" r="22" fill="#0f766e" />
    <path d="M20 8 C12 14, 10 24, 18 30 C24 30, 28 24, 28 16 C28 11, 25 8, 20 8 Z" fill="#ffffff" />
    <path d="M18 30 C22 26, 26 20, 28 14" stroke="#0f766e" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>

  <!-- Bottom Identifier Badge Pill -->
  <g transform="translate(85, 345)">
    <rect width="230" height="34" rx="17" fill="#ffffff" stroke="#0f766e" stroke-width="1.5" />
    <text x="115" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#0d3824" text-anchor="middle" letter-spacing="0.5">
      THENMOZHI • COACH
    </text>
  </g>
</svg>